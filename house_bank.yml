connectors:
  BATT:
    type: Battery
    subtype: House Bank
    pinlabels: [+, '-']
    notes: 12V House Battery Bank

  BAT_SW:
    type: Battery Switch
    subtype: ON/OFF/COMBINE
    pinlabels: [Common, House, OFF, Start]
    notes: Battery selector switch

  POS_BUS:
    type: Bus Bar
    subtype: Positive Distribution
    pincount: 4
    pinlabels: [In, DP1, DP2, Spare1]
    notes: Positive bus bar

  NEG_BUS:
    type: Bus Bar
    subtype: Negative Distribution
    pincount: 8
    pinlabels: [In, DP1, DP2, Spare1, Spare2, Spare3, Spare4, Spare5]
    notes: Negative bus bar

  DP1:
    type: Distribution Panel
    subtype: 8-Position Panel
    pincount: 9
    pinlabels: ['+', C1+, C2+, C3+, C4+, C5+, C6+, C7+, C8+]
    notes: Distribution Panel 1

  DP2:
    type: Distribution Panel
    subtype: 8-Position Panel
    pincount: 9
    pinlabels: ['+', C1+, C2+, C3+, C4+, C5+, C6+, C7+, C8+]
    notes: Distribution Panel 2

  DP1_NEG_BUS:
    type: Bus Bar
    subtype: Negative Distribution
    pincount: 8
    pinlabels: [In, C1-, C2-, C3-, C4-, C5-, C6-, C7-, C8-]
    notes: DP1 Negative Bus Bar

  DP2_NEG_BUS:
    type: Bus Bar
    subtype: Negative Distribution
    pincount: 8
    pinlabels: [In, C1-, C2-, C3-, C4-, C5-, C6-, C7-, C8-]
    notes: DP2 Negative Bus Bar

  CABIN_LIGHTS:
    type: Load
    subtype: Lighting
    pinlabels: ['+', '-']
    notes: Cabin Lights

  12-12_CONV:
    type: Load
    subtype: DC-DC Converter
    pinlabels: [In+, In-, Out+, Out-]
    notes: 12-12 Converter

  NKE_BOX_1:
    type: Connector
    subtype: NKE Electronics
    pinlabels: [12+, 12-, topline+_2, topline-_2, topline_data_2, topline+_3, topline-_3, topline_data_3, topline+_4, topline-_4, topline_data_4, NMEA-, NMEA+]
    notes: NKE Box 1

  NKE_BOX_2:
    type: Connector
    subtype: NKE Electronics
    pinlabels: [12+, 12-, topline+_2, topline-_2, topline_data_2, topline+_3, topline-_3, topline_data_3, topline+_4, topline-_4, topline_data_4, NMEA-, NMEA+]
    notes: NKE Box 2

  NKE_MULTIGRAPHIC:
    type: Load
    subtype: Display
    pinlabels: [topline+, topline-, topline_data, NMEA-, NMEA+]
    notes: NKE Multigraphic

  NKE_MULTIGRAPHIC_2:
    type: Load
    subtype: Display
    pinlabels: [topline+, topline-, topline_data, NMEA-, NMEA+]
    notes: NKE Multigraphic 2

  NKE_GYROPILOT_PORT:
    type: Load
    subtype: Autopilot
    pinlabels: ['+', '-', clutch1, clutch2, topline+, topline-, topline_data, ram_12+, ram_12-]
    notes: NKE Gyropilot Port

  FUSE_RAM_1:
    type: Fuse
    pinlabels: [In, Out]
    notes: Ram Fuse 1

  FUSE_RAM_2:
    type: Fuse
    pinlabels: [In, Out]
    notes: Ram Fuse 2

  AUTOPILOT_RAM_PORT:
    type: Connector
    subtype: Hydraulic Ram
    pinlabels: [clutch1, clutch2, 12+, 12-]
    notes: Autopilot Ram Port

  TPDT_SWITCH:
    type: Switch
    subtype: TPDT
    pinlabels: [topline+_in, topline+_port, topline+_stbd, topline-_in, topline-_port, topline-_stbd, topline_data_in, topline_data_port, topline_data_stbd]
    notes: NKE Topline Switch

  NKE_BOX_STARBOARD:
    type: Connector
    subtype: NKE Electronics
    pinlabels: [12+, 12-, topline+_2, topline-_2, topline_data_2, topline+_3, topline-_3, topline_data_3, topline+_4, topline-_4, topline_data_4, NMEA-, NMEA+]
    notes: NKE Box Starboard

  NKE_GYROPILOT_STARBOARD:
    type: Load
    subtype: Autopilot
    pinlabels: ['+', '-', clutch1, clutch2, topline+, topline-, topline_data, ram_12+, ram_12-]
    notes: NKE Gyropilot Starboard

  FUSE_RAM_STARBOARD_1:
    type: Fuse
    pinlabels: [In, Out]
    notes: Ram Fuse Starboard 1

  FUSE_RAM_STARBOARD_2:
    type: Fuse
    pinlabels: [In, Out]
    notes: Ram Fuse Starboard 2

  AUTOPILOT_RAM_STARBOARD:
    type: Connector
    subtype: Hydraulic Ram
    pinlabels: [clutch1, clutch2, 12+, 12-]
    notes: Autopilot Ram Starboard

